<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kimine Göre Ben</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  #stage {
    position: relative; width: 540px; height: 960px; overflow: hidden;
    font-family: "DejaVu Sans", sans-serif; background: #74b9ff;
  }
  svg { position: absolute; inset: 0; }
  .txt { position: absolute; left: 24px; right: 24px; text-align: center; }
  #title {
    top: 70px; font-size: 38px; font-weight: 800; color: #fff; line-height: 1.15;
    text-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  #title .pill {
    display: inline-block; background: #2d3436; padding: 14px 22px; border-radius: 22px;
    box-shadow: 0 8px 0 rgba(0,0,0,.18);
  }
  #title .small { display: block; font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  #sub { top: 230px; font-size: 22px; font-weight: 700; color: #2d3436; }
  #sub span {
    display: inline-block; background: #fff; padding: 10px 16px; border-radius: 16px;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
  }
  #bubble {
    position: absolute; left: 40px; right: 40px; top: 210px; background: #fff; border-radius: 26px;
    padding: 22px; font-size: 30px; font-weight: 800; color: #2d3436; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
  }
  #bubble::after {
    content: ""; position: absolute; left: 260px; bottom: -34px; border: 18px solid transparent;
    border-top: 22px solid #fff;
  }
  #final {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 26px; background: linear-gradient(160deg, #fd79a8, #6c5ce7);
    color: #fff; text-align: center; padding: 0 30px;
  }
  #final .big { font-size: 44px; font-weight: 800; line-height: 1.2; text-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #final .mid { font-size: 27px; font-weight: 700; line-height: 1.3; }
  #final .cta {
    font-size: 26px; font-weight: 800; background: #fff; color: #6c5ce7; padding: 16px 28px;
    border-radius: 40px; box-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  #confetti { position: absolute; inset: 0; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 540 960" width="540" height="960"></svg>
  <div id="title" class="txt"></div>
  <div id="sub" class="txt"></div>
  <div id="bubble"></div>
  <div id="final">
    <div class="big">Soyadım Ünlü,<br>ben henüz değilim 😄</div>
    <div class="mid">Bu sefer bırakmıyorum.<br>3D yazıcı serüvenim başlıyor 🖨️</div>
    <div class="cta">Takip et, birlikte görelim! 💜</div>
  </div>
  <svg id="confetti" viewBox="0 0 540 960" width="540" height="960"></svg>
  <div id="flash"></div>

const BEAT = 60 / 124; // müzikle aynı tempo

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { x = clamp(x); return 1 + Math.sin(x * Math.PI) * 0.12 * (1 - x) - 0.15 * (1 - ease(x)); };
const bounce = t => Math.abs(Math.sin(t * Math.PI / BEAT)); // her vuruşta bir zıplama
const $ = id => document.getElementById(id);

const TOP_CURLS = [[138,142,22],[160,116,25],[198,106,27],[236,114,25],[262,140,22],[124,165,18],[276,166,18]];
function curls(list, fill, hi, mirror) {
  let d = "";
  for (const [x, y, r] of list) {
    const xs = mirror ? [x, 400 - x] : [x];
    for (const cx of xs) {
      d += `<circle cx="${cx}" cy="${y}" r="${r}" fill="${fill}"/>`;
      d += `<path d="M${cx - r * .45} ${y} a${r * .45} ${r * .45} 0 1 1 ${r * .5} ${r * .35}" stroke="${hi}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
  }
  return d;
}
function eyes(iris) {
  return [175, 225].map(x => iris
    ? `<circle cx="${x}" cy="182" r="9" fill="${iris}"/><circle cx="${x}" cy="182" r="4.6" fill="#2d3436"/><circle cx="${x + 3}" cy="178.5" r="2.6" fill="#fff"/>`
    : `<circle cx="${x}" cy="182" r="7.5" fill="#2d3436"/><circle cx="${x + 2.5}" cy="179.5" r="2.4" fill="#fff"/>`).join("");
}

function setHands(p, l, r) {

}
function headTilt(p, deg, dy = 0) {
  const tr = `translate(0,${dy}) rotate(${deg} 200 245)`;
  $(p + "-head").setAttribute("transform", tr);
  $(p + "-hairback").setAttribute("transform", tr);
}
function face(p, { mouth = "smile", eyes = "open", eyeScale = 1 } = {}) {
  $(p + "-mouth").style.display = mouth === "O" ? "none" : "";
  $(p + "-mouthO").style.display = mouth === "O" ? "" : "none";
  const shapes = {
    smile: "M183 210 Q200 228 217 210", big: "M180 208 Q200 236 220 208",
    flat: "M186 216 L214 216", frown: "M185 222 Q200 210 215 222", wavy: "M182 216 Q191 208 200 216 T218 216",
  };
  if (shapes[mouth]) $(p + "-mouth").setAttribute("d", shapes[mouth]);
  $(p + "-eyes").style.display = eyes === "X" ? "none" : "";
  $(p + "-eyesX").style.display = eyes === "X" ? "" : "none";
  $(p + "-eyes").setAttribute("transform", `translate(200,182) scale(${eyeScale}) translate(-200,-182)`);
}

// Basit, tekrarlanabilir rastgele sayı
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function confetti(lt, n = 40) {
  let d = "";
  const cols = ["#fdcb6e", "#55efc4", "#74b9ff", "#ff7675", "#a29bfe", "#fff"];
  for (let i = 0; i < n; i++) {
    const y = ((lt * (120 + rnd(i) * 140) + rnd(i + 9) * 960) % 1000) - 30;
    const x = rnd(i + 3) * 540 + Math.sin(lt * 3 + i) * 20;
    const r = lt * 300 * (rnd(i + 5) - 0.5);
    d += `<rect x="-6" y="-3" width="12" height="6" fill="${cols[i % cols.length]}" transform="translate(${x},${y}) rotate(${r})"/>`;
  }
  $("confetti").innerHTML = d;
}

function render(t) {
  const s = SCENES.find(x => t >= x.start && t < x.end) || SCENES[SCENES.length - 1];
  if (current !== s.id) enterScene(s);
  const lt = t - s.start;

  $("flash").style.opacity = s.start > 0 ? clamp(1 - lt / 0.22) * 0.85 : 0;
  // Sahne girişinde hafif kamera sarsıntısı
  const shake = clamp(1 - lt / 0.3) * 8;
  $("stage").style.transform = "";
  $("svg").style.transform = `translate(${Math.sin(lt * 90) * shake}px,${Math.cos(lt * 70) * shake}px)`;

  $("title").style.transform = `scale(${pop(lt / 0.4)}) rotate(${Math.sin(t * 2.4) * 1.5}deg)`;
  $("title").style.opacity = clamp(lt / 0.15);

  const sub = SUBS[s.id];
  if (sub && lt >= sub[0]) {
    $("sub").innerHTML = `<span>${sub[1]}</span>`;
    $("sub").style.transform = `translateY(${(1 - ease((lt - sub[0]) / 0.3)) * 30}px)`;
    $("sub").style.opacity = clamp((lt - sub[0]) / 0.2);
  } else { $("sub").innerHTML = ""; }
  $("sub").style.top = s.id === "anne" ? "880px" : "230px";

  // Karakter: girişte zıplama, müzikle sallanma
  const cx = +($("char").dataset.x || 70);
  const sc = pop(lt / 0.45);
  const hop = bounce(t) * 10;
  const sway = Math.sin(t * Math.PI / BEAT / 2) * 3;
  let jumpY = 0, sq = 1;
  if (s.id === "print" && lt < 3.2) { jumpY = -Math.abs(Math.sin(lt * 7)) * 40; sq = 1 + Math.abs(Math.cos(lt * 7)) * 0.04; }
  if (s.id === "intro") { jumpY = -Math.abs(Math.sin(lt * 6.5)) * 22; }
  $("char").setAttribute("transform",
    `translate(${cx},${300 - hop + jumpY}) translate(200,575) rotate(${sway}) scale(${sc / sq},${sc * sq}) translate(-200,-575)`);
  headTilt("b", Math.sin(t * Math.PI / BEAT) * 5);

  const blink = (t % 3.1) < 0.12;
  face("b", { eyeScale: blink ? 0.15 : 1 });
  $("b-eyes").setAttribute("transform", `translate(0,182) scale(1,${blink ? 0.12 : 1}) translate(0,-182)`);

  if (s.id === "eng") renderEng(lt);
  if (s.id === "wood") renderWood(lt);
  if (s.id === "pet") renderPet(lt);
  if (s.id === "mom") renderMom(lt);
  if (s.id === "print" || s.id === "intro") renderPrinter(s.id, lt);
  if (s.id === "print") renderPrint(lt);
  if (s.id === "anne") renderAnne(lt, t);
  if (s.id === "intro") renderIntro(lt);
}

function renderEng(lt) {
  document.querySelectorAll("#code rect").forEach((r, i) => {
    r.setAttribute("width", +r.dataset.w * clamp((lt - 0.2 - i * 0.3) / 0.3));
  });
  const err = lt > 1.9 && lt < 2.9, ok = lt >= 3.1;
  $("code").style.display = err || ok ? "none" : "";
  $("screen").setAttribute("fill", err ? "#d63031" : ok ? "#00b894" : "#1e272e");
  $("scrtxt").textContent = err ? (Math.floor(lt * 8) % 2 ? "HATA!" : "") : ok ? "✓ ÇALIŞTI" : "";
  // Hata: laptop titrer, kafa sallar, yüz şaşkın; çalışınca omuz silker
  const jit = err ? Math.sin(lt * 80) * 4 : 0;
  $("laptop").setAttribute("transform", `translate(${jit},0)`);
  if (err) { headTilt("b", Math.sin(lt * 30) * 10); face("b", { mouth: "O", eyeScale: 1.3 }); }
  if (ok) {
    const shrug = Math.sin(clamp((lt - 3.1) / 0.5) * Math.PI) * 18;
    setHands("b", [126, 392 - shrug], [274, 392 - shrug]);
    face("b", { mouth: "wavy" });
    headTilt("b", 12);
  }
  $("qmarks").style.display = ok ? "" : "none";
  $("qmarks").setAttribute("transform", `translate(0,${-((lt * 40) % 20)})`);
  $("sweat").setAttribute("transform", `translate(0,${(lt * 30) % 40})`);
  $("sweat").style.opacity = err ? 1 - ((lt * 30) % 40) / 40 : 0;
}

function renderWood(lt) {
  // Üç çekiç darbesi: ikisi çiviye, üçüncüsü parmağa
  const hits = [[0.9, [240, 345]], [1.6, [240, 345]], [2.4, [180, 388]]];
  let k = 0, target = hits[0][1];
  for (const [h, tg] of hits) {
    const d = lt - h + 0.35;
    if (d >= 0 && d < 0.6) { k = d < 0.35 ? d / 0.35 : 1 - (d - 0.35) / 0.25; target = tg; }
  }
  const ouch = lt >= 2.4;
  const e = ease(k);
  const hr = [300 + (target[0] - 300) * e, 250 + (target[1] - 250) * e];
  const ang = -10 - 80 * e;
  // Parmağa vurduktan sonra elini sallar
  let hl = [96, 392];
  if (ouch) {
    const w = lt - 2.4;
    hl = [96 + Math.sin(w * 30) * 18, 360 + Math.cos(w * 30) * 10 - 30 * clamp(w / 0.2)];
  }
  setHands("b", hl, hr);
  $("hammer").setAttribute("transform", `translate(${hr[0]},${hr[1]}) rotate(${ang})`);
  $("plank").setAttribute("transform", `rotate(${ouch ? -8 + Math.sin(lt * 12) * 3 * clamp(1 - (lt - 2.4)) : -8} 200 380)`);
  const o = $("ouch");
  o.style.display = ouch && lt < 3.6 ? "" : "none";
  o.setAttribute("transform", `translate(${hl[0] - 96},${hl[1] - 392}) scale(${pop((lt - 2.4) / 0.3)})`);
  if (ouch) {
    face("b", lt < 3.4 ? { mouth: "O", eyes: "X" } : { mouth: "wavy" });
    headTilt("b", lt < 3.4 ? Math.sin(lt * 40) * 6 : -6);
  }
  let d = "";
  for (let i = 0; i < 14; i++) {
    const y = ((lt * 90 + i * 37) % 160);
    const x = 70 + (i * 53) % 260 + Math.sin(lt * 4 + i) * 6;
    d += `<circle cx="${x}" cy="${400 + y}" r="${2 + (i % 3)}" fill="#c69c6d" opacity="${1 - y / 160}"/>`;
  }
  $("dust").innerHTML = d;
}

function renderPet(lt) {
  // Fön karakterin kendi saçını uçuruyor; köpek mükemmel
  const gust = Math.sin(lt * 22);
  $("messy").setAttribute("transform", `translate(200,100) rotate(${gust * 7}) scale(${1 + 0.15 * Math.abs(gust)}) translate(-200,-100)`);
  $("air").style.opacity = 0.5 + 0.5 * Math.sin(lt * 25);
  $("dryer").setAttribute("transform", `translate(330,${288 + Math.sin(lt * 9) * 6}) rotate(${Math.sin(lt * 4) * 8})`);
  setHands("b", [108, 392], [326, 296 + Math.sin(lt * 9) * 6]);
  $("sparkles").style.opacity = 0.5 + 0.5 * Math.sin(lt * 6);
  $("sparkles").setAttribute("transform", `scale(${1 + 0.08 * Math.sin(lt * 6)})`);
  // 3. saniyede köpek silkinir, su ve tüyler karakterin üstüne
  const shakeDog = lt > 2.8 && lt < 3.6;
  $("dogbody").setAttribute("transform", shakeDog ? `rotate(${Math.sin(lt * 60) * 9} 70 90)` : "");
  $("dog").setAttribute("transform", `translate(360,${690 - Math.abs(Math.sin(lt * 4)) * 6})`);
  let drops = "";
  if (lt > 2.8) {
    for (let i = 0; i < 18; i++) {
      const p = clamp((lt - 2.8 - rnd(i) * 0.4) / 0.6);
      if (p <= 0 || p >= 1) continue;
      const x = 20 - p * (180 + rnd(i + 1) * 120), y = 40 - Math.sin(p * Math.PI) * (80 + rnd(i + 2) * 80) + p * 60;
      drops += i % 2
        ? `<path d="M${x} ${y} q5 9 0 12 q-5 -3 0 -12z" fill="#74b9ff"/>`
        : `<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#dfe6e9"/>`;
    }
  }
  $("drops").innerHTML = drops;
  if (lt > 3.3) { face("b", { mouth: "flat", eyeScale: 0.9 }); headTilt("b", -8); }
  else face("b", { mouth: lt > 2.8 ? "O" : "smile" });
  let tufts = "";
  for (let i = 0; i < 6; i++) {
    const p = (lt * 0.8 + rnd(i)) % 1;
    tufts += `<circle cx="${180 + p * 160 * (rnd(i + 4) - 0.5) * 2}" cy="${60 - p * 90}" r="${5 + rnd(i) * 4}" fill="#6b4a30" opacity="${1 - p}"/>`;
  }
  $("tufts").innerHTML = tufts;
}

function renderMom(lt) {

  // Kızım (4) eteğimden çekiştiriyor, zıplıyor
  const gx = 410, gy = 700 - Math.abs(Math.sin(lt * 8)) * 26;
  $("girl").setAttribute("transform", `translate(${gx},${gy})`);
  const tug = Math.sin(lt * 12) * 8;
  $("girl-arm").setAttribute("x2", -62 + tug); $("girl-arm").setAttribute("y2", 0);
  $("girl-hand").setAttribute("cx", -62 + tug); $("girl-hand").setAttribute("cy", 0);

  // Annem sakin ama göz seğiriyor
  face("b", { mouth: "smile" });

  $("b-eyes").setAttribute("transform", twitch ? "translate(175,182) scale(1,.3) translate(-175,-182)" : "");
  setHands("b", [118, 372], [300 + tug * 0.5, 400 + Math.abs(tug)]);

  const calls = [[0.4, 300, 640, "ANNE!"], [1.3, 40, 560, "MAMA!"], [2.1, 330, 600, "ANNE BAK!"], [2.9, 60, 600, "MAMAAA!"], [3.5, 300, 650, "ANNEEE!"]];
  let fx = "";

      <text x="${(w.length * 19 + 20) / 2}" y="0" font-size="24" font-weight="800" text-anchor="middle" fill="#d63031">${w}</text></g>`;
  }
  $("fx").innerHTML = fx;
}

function renderPrint(lt) {
  const spag = lt > 3.2;
  if (!spag) {
    face("b", { mouth: "big", eyeScale: 1.25 });
    setHands("b", [150 + Math.sin(lt * 14) * 8, 320], [250 - Math.sin(lt * 14) * 8, 320]); // heyecandan alkış
  } else if (lt < 3.8) {
    face("b", { mouth: "O", eyeScale: 1.6 });
    headTilt("b", 0, 6);
    setHands("b", [150, 220], [250, 220]); // eller yüzde
  } else {
    face("b", { mouth: "big" });
    headTilt("b", -10);
    setHands("b", [120, 330], [345, 290 + Math.sin(lt * 6) * 8]); // gururla gösterir
    let fx = "";
    for (let i = 0; i < 4; i++) {
      const a = lt * 2 + i * 1.6;
      fx += `<text x="${415 + Math.cos(a) * 110}" y="${660 + Math.sin(a) * 60}" font-size="${26 + 6 * Math.sin(lt * 5 + i)}">✨</text>`;
    }
    $("fx").innerHTML = fx;
  }
  if (spag && lt < 3.8) {
    $("fx").innerHTML = `<text x="250" y="560" font-size="70" transform="rotate(${Math.sin(lt * 30) * 10} 280 540)">❗</text>`;
  }
}

function renderAnne(lt, t) {
  $("title").innerHTML = `<span class="pill">Anneme sorarsanız…</span>`;
  const b = $("bubble");
  if (lt >= 1.5) {
    const full = "Kızım sen hiçbir iş yapmadın ki.";
    const n = Math.floor(clamp((lt - 1.5) / 1.6) * full.length);
    b.style.display = "";
    b.textContent = full.slice(0, Math.max(1, n));
    $("title").style.opacity = 0;
  }
  const talking = lt > 1.5 && lt < 3.2;
  const open = talking && Math.floor(lt * 10) % 2;
  $("a-mouth").style.display = open ? "none" : "";
  $("a-mouthO").style.display = open ? "" : "none";
  // Annem kafasını yavaşça çevirip kameraya bakar
  $("a-head").setAttribute("transform", `rotate(${lt < 1.4 ? -8 + lt * 6 : Math.sin(lt * 0.8) * 1.5} 200 245)`);
  $("a-hairback").setAttribute("transform", $("a-head").getAttribute("transform"));
  // Çay yudumu
  const sip = clamp((lt - 4.3) / 0.4) - clamp((lt - 5.4) / 0.4);
  $("tea").setAttribute("transform", `translate(${296 - sip * 70},${318 - sip * 110}) rotate(${-sip * 25})`);
  setHands("a", [118, 378], [296 - sip * 70, 352 - sip * 110]);
  $("steam").setAttribute("transform", `translate(0,${-(lt * 12 % 10)})`);
  $("annep").setAttribute("transform", `translate(110,${300 + Math.sin(t * 2) * 2})`);
  // Begüm kenardan umutla bakar, lafı duyunca yavaşça kaybolur
  const inP = ease((lt - 0.3) / 0.5);
  const outP = ease((lt - 3.6) / 1.4);
  const sad = lt > 3.3;
  $("peek-happy").style.display = sad ? "none" : "";
  $("peek-sad").style.display = sad ? "" : "none";
  const px = -70 + inP * 140 - outP * 60, py = 640 + outP * 260;
  $("peek").setAttribute("transform", `translate(${px},${py}) rotate(${20 - inP * 10 + outP * 25})`);
  if (lt > 3.3 && lt < 4.6) {
    const p = (lt - 3.3) / 1.3;
    $("fx").innerHTML = `<text x="${px + 40}" y="${py - 90 - p * 60}" font-size="48" opacity="${1 - p}">💔</text>`;
  } else $("fx").innerHTML = "";
}

function renderIntro(lt) {
  const wave = Math.sin(lt * 9) * 28;
  setHands("b", [108, 378], [330 + wave * 0.4, 190 + Math.abs(wave) * 0.2]);
  const talking = lt < 7.8 && Math.floor(lt * 7) % 2;
  face("b", { mouth: talking ? "O" : "big" });
  let line = INTRO_LINES[0];
  for (const l of INTRO_LINES) if (lt >= l[0]) line = l;
  $("title").innerHTML = `<span class="pill" style="font-size:30px;font-weight:700">${line[1]}</span>`;
  const ll = lt - line[0];
  $("title").style.transform = `scale(${pop(ll / 0.4)}) rotate(${Math.sin(lt * 2.4) * 1.5}deg)`;
  $("title").style.opacity = clamp(ll / 0.15);
  confetti(lt, 30);
  const f = $("final");
  if (lt >= 8) {
    f.style.display = "flex";
    f.style.opacity = clamp((lt - 8) / 0.3);
    f.style.transform = `scale(${pop((lt - 8) / 0.5)})`;
    f.querySelector(".cta").style.transform = `scale(${1 + 0.06 * bounce(lt)})`;
    confetti(lt, 60);
  } else f.style.display = "none";
}

function renderPrinter(mode, lt) {
  const obj = $("pobj");
  $("spool").setAttribute("transform", `rotate(${lt * 120} 105 -18)`);
  $("pled").setAttribute("fill", Math.floor(lt * 4) % 2 ? "#00b894" : "#55efc4");
  if (mode === "print") {
    const prog = clamp((lt - 0.3) / 2.8);
    const spag = lt > 3.2;
    const layers = Math.floor(prog * 16);
    let d = "";
    if (!spag) {
      for (let i = 0; i < layers; i++) {
        const w = 60 + Math.sin(i / 15 * Math.PI) * 50;
        d += `<rect x="${105 - w / 2}" y="${232 - i * 9}" width="${w}" height="8" rx="3" fill="${i % 2 ? "#e17055" : "#fab1a0"}"/>`;
      }
    }
    obj.innerHTML = d;
    $("pspag").style.display = spag ? "" : "none";
    const ny = spag ? 50 : 226 - layers * 9;
    const nx = spag ? 105 + Math.sin(lt * 3) * 10 : 105 + Math.sin(lt * 14) * 55;
    $("pnozzle").setAttribute("transform", `translate(${nx},${ny - 6})`);
    $("pgantry").setAttribute("y", ny - 10);
    $("pstring").setAttribute("transform", `translate(${Math.sin(lt * 5) * 6},0)`);
    $("printer").setAttribute("transform", `translate(310,${560 + (spag && lt < 3.6 ? Math.sin(lt * 70) * 4 : 0)})`);
  } else {
    // Tanıtımda: bu sefer düzgün bir kalp basıyor
    $("pspag").style.display = "none";
    const prog = clamp(lt / 7);
    const layers = Math.floor(prog * 14);
    let d = "";
    for (let i = 0; i < layers; i++) {
      const y = i / 13;
      const w = y < 0.7 ? 20 + y / 0.7 * 120 : 140 - (y - 0.7) / 0.3 * 40;
      if (y > 0.82) {
        d += `<rect x="45" y="${232 - i * 10}" width="50" height="9" rx="4" fill="#e84393"/>`;
        d += `<rect x="115" y="${232 - i * 10}" width="50" height="9" rx="4" fill="#e84393"/>`;
      } else d += `<rect x="${105 - w / 2}" y="${232 - i * 10}" width="${w}" height="9" rx="4" fill="#e84393"/>`;
    }
    obj.innerHTML = d;
    const ny = 226 - layers * 10;
    $("pnozzle").setAttribute("transform", `translate(${105 + Math.sin(lt * 12) * 45},${ny - 6})`);
    $("pgantry").setAttribute("y", ny - 10);
  }
}

window.render = render;
window.DURATION = DURATION;
// Tarayıcıda açılınca canlı oynat
if (!location.hash.includes("capture")) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
</body>
</html>
